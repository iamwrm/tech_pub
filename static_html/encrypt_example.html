<html lang="en">
<head>
<meta charset="utf-8">

<title>Protected Page</title>
<style>
  :root { --bg:#f4f3ef; --panel:#fff; --fg:#1f2328; --muted:#6b6f76; --border:#d8d6cf; --accent:#2f6fde; --err:#cf222e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#17181a; --panel:#212226; --fg:#e6e6e6; --muted:#9a9ca3; --border:#3a3b40; --accent:#4c8bf5; --err:#f85149; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
         background:var(--bg); color:var(--fg); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  form { width:100%; max-width:360px; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:24px; }
  h1 { font-size:18px; margin:0 0 4px; }
  p { margin:0 0 16px; color:var(--muted); }
  input, button { width:100%; font:inherit; padding:9px 12px; border-radius:8px; }
  input { border:1px solid var(--border); background:var(--bg); color:var(--fg); margin-bottom:10px; }
  button { border:1px solid var(--accent); background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:progress; }
  #msg { min-height:1.5em; margin:10px 0 0; color:var(--err); }
</style>
</head>

(() => {
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const $ = (id) => document.getElementById(id);

  async function decrypt(password) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', hash: 'SHA-256', salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct));
    return new TextDecoder().decode(pt);
  }

  async function unlock(password) {
    $('go').disabled = true; $('msg').textContent = ''; $('go').textContent = 'Decrypting…';
    try {
      const html = await decrypt(password);
      // Replace the whole document so the decrypted page's own scripts run.
      document.open(); document.write(html); document.close();
    } catch {
      $('msg').textContent = 'Wrong password.';
      $('go').disabled = false; $('go').textContent = 'Unlock';
      $('pw').select();
    }
  }

  if (!window.crypto || !crypto.subtle) {
    $('msg').textContent = 'This browser cannot decrypt (Web Crypto needs HTTPS).';
    $('go').disabled = true;
    return;
  }

  $('f').addEventListener('submit', (e) => { e.preventDefault(); unlock($('pw').value); });

  const k = new URLSearchParams(location.hash.slice(1)).get('k');
  if (k) { history.replaceState(null, '', location.pathname + location.search); unlock(k); }
})();
